<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Vela Agent — capture</title>
  </head>
  <body>
    <pre id="log" style="font-family: monospace; font-size: 12px"></pre>
    <script>
      'use strict';

      // ---- Config desde la query que pasa main.js ------------------------
      const params = new URLSearchParams(location.search);
      const SERVER = params.get('server') || 'ws://localhost:8080';
      const NAME = params.get('name') || 'PC';
      const TOKEN = params.get('token') || '';
      const SHOW_INDICATOR = params.get('indicator') === '1';

      const report = (patch) => window.agentAPI && window.agentAPI.reportStatus && window.agentAPI.reportStatus(patch);
      const logEl = document.getElementById('log');
      const log = (...a) => {
        console.log(...a);
        logEl.textContent = (a.join(' ') + '\n' + logEl.textContent).slice(0, 4000);
      };

      // ---- Presets de calidad -------------------------------------------
      const QUALITY = {
        alta: { maxBitrate: 8_000_000, maxFramerate: 30, scale: 1 },
        media: { maxBitrate: 3_000_000, maxFramerate: 20, scale: 1 },
        baja: { maxBitrate: 1_000_000, maxFramerate: 12, scale: 1.5 },
      };
      let currentQuality = 'alta';

      // ---- Estado --------------------------------------------------------
      let ws = null;
      let myId = null;
      let stream = null;
      // Config ICE (STUN/TURN) que entrega el servidor al registrarse. Hasta
      // entonces, STUN publico como respaldo para pruebas en LAN.
      let rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
      // Si el servidor rechazo el token no tiene sentido reintentar cada 2s.
      let unauthorized = false;
      /** viewerId -> { pc, channel } */
      const peers = new Map();
      let indicatorTimer = null;

      // ---- Captura de pantalla ------------------------------------------
      async function ensureStream() {
        if (stream) return stream;
        stream = await navigator.mediaDevices.getDisplayMedia({
          video: { frameRate: { ideal: 30, max: 30 } },
          audio: false,
        });
        const track = stream.getVideoTracks()[0];
        if ('contentHint' in track) track.contentHint = 'text'; // nitidez de texto
        log('captura iniciada:', track.getSettings().width + 'x' + track.getSettings().height);
        return stream;
      }

      async function applyQuality(pc, preset) {
        const sender = pc.getSenders().find((s) => s.track && s.track.kind === 'video');
        if (!sender) return;
        const p = sender.getParameters();
        if (!p.encodings || !p.encodings.length) p.encodings = [{}];
        const q = QUALITY[preset] || QUALITY.alta;
        p.encodings[0].maxBitrate = q.maxBitrate;
        p.encodings[0].maxFramerate = q.maxFramerate;
        p.encodings[0].scaleResolutionDownBy = q.scale;
        p.degradationPreference = 'maintain-framerate';
        try {
          await sender.setParameters(p);
        } catch (e) {
          log('setParameters:', e.message);
        }
      }

      // ---- WebSocket / senalizacion -------------------------------------
      function send(obj) {
        if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj));
      }

      function connect() {
        ws = new WebSocket(SERVER);
        report({ connection: 'connecting', viewers: 0 });
        ws.onopen = () => {
          log('conectado a', SERVER);
          send({ type: 'register', role: 'agent', name: NAME, token: TOKEN });
        };
        ws.onclose = (ev) => {
          const wait = unauthorized ? 30000 : 2000;
          log(`ws cerrado (${ev.code}), reintento en ${wait / 1000}s`);
          for (const { pc } of peers.values()) pc.close();
          peers.clear();
          report({ connection: unauthorized ? 'unauthorized' : 'offline', viewers: 0 });
          setTimeout(connect, wait);
        };
        ws.onerror = () => ws.close();
        ws.onmessage = (ev) => handle(JSON.parse(ev.data));
      }

      async function handle(msg) {
        switch (msg.type) {
          case 'welcome':
            myId = msg.id;
            break;

          case 'registered':
            unauthorized = false;
            if (Array.isArray(msg.iceServers) && msg.iceServers.length) {
              rtcConfig = { iceServers: msg.iceServers };
              if (msg.iceTransportPolicy) rtcConfig.iceTransportPolicy = msg.iceTransportPolicy;
            }
            log('registrado como', myId, '· ice:', msg.iceServers.map((s) => s.urls).flat().join(' '));
            report({ connection: 'online' });
            break;

          case 'error':
            if (msg.code === 'unauthorized') {
              unauthorized = true;
              log('el servidor rechazo el token (VELA_TOKEN). Revisa la configuracion.');
            } else {
              log('error del servidor:', msg.message || msg.code);
            }
            break;

          case 'subscribe':
            await createPeer(msg.viewerId);
            break;

          case 'answer': {
            const p = peers.get(msg.from);
            if (p) await p.pc.setRemoteDescription({ type: 'answer', sdp: msg.sdp });
            break;
          }

          case 'ice': {
            const p = peers.get(msg.from);
            if (p && msg.candidate) {
              try {
                await p.pc.addIceCandidate(msg.candidate);
              } catch (e) {
                log('addIceCandidate:', e.message);
              }
            }
            break;
          }

          case 'unsubscribe':
          case 'peer-left': {
            const id = msg.viewerId || msg.id;
            const p = peers.get(id);
            if (p) {
              p.pc.close();
              peers.delete(id);
              report({ viewers: peers.size });
            }
            break;
          }
        }
      }

      async function createPeer(viewerId) {
        await ensureStream();
        const pc = new RTCPeerConnection(rtcConfig);

        // Canal de control: el visor manda mouse/teclado y presets por aqui.
        const channel = pc.createDataChannel('ctrl', { ordered: true });
        channel.onmessage = (e) => onControlMessage(JSON.parse(e.data));

        for (const track of stream.getVideoTracks()) pc.addTrack(track, stream);

        pc.onicecandidate = (e) => {
          if (e.candidate) send({ type: 'ice', to: viewerId, candidate: e.candidate });
        };
        pc.onconnectionstatechange = () => {
          if (['failed', 'closed', 'disconnected'].includes(pc.connectionState)) {
            pc.close();
            peers.delete(viewerId);
            report({ viewers: peers.size });
          }
        };

        peers.set(viewerId, { pc, channel });
        report({ viewers: peers.size });

        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        await applyQuality(pc, currentQuality);
        send({ type: 'offer', to: viewerId, sdp: offer.sdp });
        log('offer -> visor', viewerId);
      }

      // ---- Mensajes de control del visor --------------------------------
      function onControlMessage(m) {
        if (m.kind === 'input') {
          window.agentAPI.applyInput(m);
          pingIndicator();
        } else if (m.kind === 'config' && m.quality) {
          currentQuality = m.quality;
          for (const { pc } of peers.values()) applyQuality(pc, currentQuality);
          log('calidad ->', currentQuality);
        }
      }

      // El indicador en pantalla solo se enciende si SHOW_INDICATOR esta activo.
      function pingIndicator() {
        if (!SHOW_INDICATOR) return;
        window.agentAPI.setControlIndicator(true);
        clearTimeout(indicatorTimer);
        indicatorTimer = setTimeout(() => window.agentAPI.setControlIndicator(false), 1500);
      }

      connect();
    </script>
  </body>
</html>
