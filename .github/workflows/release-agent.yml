# Compila el agente para Windows y macOS y publica los instaladores en un
# GitHub Release. Se dispara con una etiqueta `v*` (p. ej. `git tag v0.1.0 &&
# git push --tags`) o a mano desde Actions. El dashboard lee ese Release
# (/descargas) para ofrecer los ficheros.
name: release-agent

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - run: npm ci
      # Sin firma: no hay certificado. En macOS el usuario abre con clic derecho
      # → Abrir la primera vez (o se firma/notariza cuando haya Developer ID).
      - run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: agent-${{ matrix.os }}
          path: |
            agent/dist/*.exe
            agent/dist/*.dmg
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.exe
            artifacts/*.dmg
          generate_release_notes: true
